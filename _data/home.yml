- id: navigation
  title: Green Navigation
  summary: Weather routing research, a startup and an open benchmark.
  proof_value: Research to software
  proof: Co-founder of Canonical Green
  image: /images/projects/green-navigation/route-comparison.jpg
  image_alt: Comparison of maritime routes across the Atlantic
  panel_title: Green Navigation
  examples:
  - title: From routing algorithms to a maritime startup
    image: /images/2024-11-22-dubai.jpg
    alt: Daniel Precioso presenting Green Navigation in Dubai
    text: I co-developed routing algorithms, ran a simulated pilot with Boluda Towage, and co-founded Canonical Green. I also
