---
layout: compress
---

{% include base_path %}

<!doctype html>
<html lang="{{ site.locale | slice: 0,2 }}" class="no-js">
  <head>
    {% include head.html %}
    {% include head/custom.html %}
  </head>

  <body>

    {% include browser-upgrade.html %}
    <a class="skip-link" href="#{% if page.layout == 'single' or page.layout == 'talk' %}main{% else %}main-content{% endif %}">Skip to content</a>
    {% include masthead.html %}

    {{ content }}

    <div class="page__footer">
      <footer>
        {% include footer/custom.html %}
        {% include footer.html %}
      </footer>
    </div>

    {% include scripts.html %}

  </body>

  <script>
    window.onload = function() {
      var startYear = 2019;
      var currentYear = new Date().getFullYear();
      var yearsOfExperience = currentYear - startYear;
      var el = document.getElementById('yearsOfExperience');
      if (el) { el.innerText = yearsOfExperience; }
    };
    </script>
  
</html>
