{%- assign image_key = include.src | remove: site.url -%}
{%- assign asset = site.data.image_assets[image_key] -%}
<img src="{% if asset %}{{ asset.src | relative_url }}{% else %}{{ include.src }}{% endif %}"{% if asset %} srcset="{{ asset.srcset }}" sizes="{{ include.sizes | default: '(min-width: 900px) 820px, 100vw' }}" width="{{ asset.width }}" height="{{ asset.height }}"{% endif %} alt="{{ include.alt | default: '' | escape }}" loading="{{ include.loading | default: 'lazy' }}" decoding="async"{% if include.class %} class="{{ include.class }}"{% endif %}{% if include.style %} style="{{ include.style }}"{% endif %}{% if include.priority %} fetchpriority="high"{% endif %}>
