{% include base_path %}

<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <a class="site-brand" href="{{ base_path }}/">{{ site.title }}</a>
      <nav class="desktop-navigation" aria-label="Main navigation">
        <ul>{% include navigation-links.html %}</ul>
      </nav>
      <details class="mobile-navigation">
        <summary>Menu</summary>
        <nav aria-label="Mobile navigation"><ul>{% include navigation-links.html %}</ul></nav>
      </details>
      <button type="button" class="theme-toggle" data-theme-toggle aria-pressed="false" hidden>Dark mode</button>
    </div>
  </div>
</div>
